[project]
site_name = "The Hitchhiker’s Guide to AI"
site_description = "An accessible guide to machine learning, transformers, large language models, and AI agent development."
site_url = "https://ai.qu3vipon.com/"
docs_dir = "docs/en"
site_dir = "site"
copyright = "Copyright &copy; 2026 Dong-hyeon Shin"
repo_url = "https://github.com/qu3vipon/the-hitchhikers-guide-to-ai"
repo_name = "the-hitchhikers-guide-to-ai"
nav = [
  { "Getting started" = [{ "About this guide" = "index.md" }, { "How to learn" = "how-to-learn.md" }, { "For hitchhikers" = "for-hitchhikers.md" }] },
  { "Understanding LLMs" = [{ "Before you start" = "llm/index.md" }, { "1. How computers learn" = "llm/01-machine-learning.md" }, { "2. The invention of neural networks" = "llm/02-neural-networks.md" }, { "3. The perceptron: a model that decides" = "llm/03-perceptron.md" }, { "4. Multilayer networks and backpropagation" = "llm/04-multilayer-perceptron.md" }, { "5. Learning in high-dimensional spaces" = "llm/05-high-dimensional-learning.md" }, { "6. Representing language as vectors" = "llm/06-word-embeddings.md" }, { "7. Language follows probabilistic patterns" = "llm/07-probabilistic-language-modeling.md" }, { "8. Connecting context with transformers" = "llm/08-transformer.md" }, { "9. Inside the transformer: the encoder" = "llm/09-transformer-encoder.md" }, { "10. Inside the transformer: the decoder" = "llm/10-transformer-decoder.md" }, { "11. Transformers in conversation" = "llm/11-gpt.md" }, { "12. Giving instructions to LLMs" = "llm/12-prompting.md" }, { "13. After pretraining" = "llm/13-after-pretraining.md" }, { "14. Modern LLMs" = "llm/14-modern-llms.md" }, { "Conclusion" = "llm/15-conclusion.md" }] },
  { "Prerequisites" = [{ "Before you start" = "prerequisites/index.md" }, { "Development environment" = [{ "Terminal" = "prerequisites/terminal.md" }, { "Basic terminal commands" = "prerequisites/terminal-commands.md" }, { "VS Code" = "prerequisites/vscode.md" }] }, { "How the web works" = [{ "What is a web service?" = "prerequisites/web-service.md" }, { "The internet" = "prerequisites/internet.md" }, { "The client-server model" = "prerequisites/client-server.md" }, { "HTTP" = "prerequisites/http.md" }, { "HTML" = "prerequisites/html.md" }, { "HTTP messages" = "prerequisites/http-message.md" }, { "URLs" = "prerequisites/url.md" }, { "HTTP methods" = "prerequisites/http-method.md" }, { "REST APIs" = "prerequisites/rest-api.md" }, { "HTTP status codes" = "prerequisites/http-status-codes.md" }, { "HTTPS" = "prerequisites/https.md" }] }, { "Networking" = [{ "IP addresses and ports" = "prerequisites/ip-port.md" }, { "DNS" = "prerequisites/dns.md" }, { "Localhost" = "prerequisites/localhost.md" }] }, { "Python" = [{ "Installing Python" = "prerequisites/python-install.md" }, { "Python virtual environments" = "prerequisites/python-virtual-environment.md" }] }] },
  { "FastAPI basics" = "wip/fastapi.md" },
  { "Asynchronous programming" = "wip/asyncio.md" },
  { "AI model serving" = "wip/model-serving.md" },
  { "LangChain & LangGraph" = "wip/langchain-langgraph.md" },
  { "AI agent development" = "wip/agent-development.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
logo = "assets/images/shared/logo.png"
favicon = "assets/images/shared/logo.png"
features = ["navigation.tabs", "navigation.footer", "navigation.top", "search.suggest", "search.highlight"]
palette = [{ "media" = "(prefers-color-scheme: light)", "scheme" = "default", "toggle" = { "icon" = "material/weather-night", "name" = "Switch to dark mode" } }, { "media" = "(prefers-color-scheme: dark)", "scheme" = "slate", "toggle" = { "icon" = "material/weather-sunny", "name" = "Switch to light mode" } }]

[project.extra]
alternate = [
  { name = "English", link = "/", lang = "en" },
  { name = "한국어", link = "/ko/", lang = "ko" },
]

[project.extra.analytics]
provider = "google"
property = "G-XYJMJ6G0BR"

[project.markdown_extensions."attr_list"]

[project.markdown_extensions."admonition"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ "name" = "mermaid", "class" = "mermaid", "format" = "pymdownx.superfences.fence_code_format" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

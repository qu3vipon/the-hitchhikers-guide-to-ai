site_name: AI 시대를 여행하는 히치하이커를 위한 안내서
site_description: An easy-to-understand e-book covering AI fundamentals, large language models, and AI agent development.
site_url: https://ai.qu3vipon.com
copyright: Copyright &copy; 2026 Dong-hyeon Shin

repo_url: https://github.com/qu3vipon/the-hitchhikers-guide-to-ai
repo_name: the-hitchhikers-guide-to-ai

theme:
  name: material
  custom_dir: overrides
  language: ko
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

extra:
  analytics:
    provider: google
    property: G-XYJMJ6G0BR

nav:
  - 시작하기:
      - 프로젝트 소개: index.md
      - 학습 방법: how-to-learn.md
      - 히치하이커를 위하여: for-hitchhikers.md
  - LLM 이해하기:
      - 시작하기 전에: llm/index.md
      - 1. 컴퓨터가 배우는 방법: llm/01-machine-learning.md
      - 2. 인공 신경망의 발명: llm/02-neural-networks.md
      - 3. 판단하는 장치, 퍼셉트론: llm/03-perceptron.md
      - 4. 거꾸로 계산하는 다층 신경망: llm/04-multilayer-perceptron.md
      - 5. 고차원 공간에서의 학습: llm/05-high-dimensional-learning.md
      - 6. 언어를 벡터로 표현하기: llm/06-word-embeddings.md
      - 7. 언어는 확률적 패턴을 따른다: llm/07-probabilistic-language-modeling.md
      - 8. 문맥을 연결하는 트랜스포머: llm/08-transformer.md
      - "9. 트랜스포머 뜯어보기: 인코더": llm/09-transformer-encoder.md
      - "10. 트랜스포머 뜯어보기: 디코더": llm/10-transformer-decoder.md
      - "11. 대화하는 트랜스포머": llm/11-chatgpt.md
      - "12. LLM에게 지시하는 방법": llm/12-prompting.md
      - "13. LLM 학습, 그 이후": llm/13-after-pretraining.md
      - "끝 마치며": llm/14-conclusion.md
  - 사전 학습:
      - 시작하기 전에: prerequisites/index.md
      - 개발 환경:
          - 터미널: prerequisites/terminal.md
          - 터미널 기본 명령어: prerequisites/terminal-commands.md
          - VS Code: prerequisites/vscode.md
      - 웹의 구조:
          - 웹 서비스란?: prerequisites/web-service.md
          - 인터넷: prerequisites/internet.md
          - 클라이언트-서버 모델: prerequisites/client-server.md
          - HTTP: prerequisites/http.md
          - HTML: prerequisites/html.md
          - "HTTP 메시지": prerequisites/http-message.md
          - URL: prerequisites/url.md
          - HTTP Method: prerequisites/http-method.md
          - REST API: prerequisites/rest-api.md
          - HTTP 상태 코드: prerequisites/http-status-codes.md
          - HTTPS: prerequisites/https.md
      - 네트워크:
          - IP와 Port: prerequisites/ip-port.md
          - DNS: prerequisites/dns.md
          - Localhost: prerequisites/localhost.md
      - Python:
          - Python 설치: prerequisites/python-install.md
          - Python 가상환경: prerequisites/python-virtual-environment.md
  - FastAPI 기초: wip/fastapi.md
  - 비동기 프로그래밍: wip/asyncio.md
  - AI 모델 서빙: wip/model-serving.md
  - LangChain & LangGraph: wip/langchain-langgraph.md
  - AI Agent 개발: wip/agent-development.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
  - javascripts/mermaid.js

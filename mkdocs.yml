site_name: AI 시대를 여행하는 히치하이커를 위한 안내서
site_description: LLM의 원리부터 AI Agent 개발까지
site_url: http://127.0.0.1:8000
copyright: Copyright &copy; 2026 Dong-hyeon Shin

theme:
  name: material
  custom_dir: overrides
  language: ko
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

nav:
  - 시작하기:
      - 프로젝트 소개: index.md
      - 학습 방법: how-to-learn.md
      - 히치하이커를 위하여: for-hitchhikers.md
  - LLM 이해하기:
      - 시작하기 전에: llm/index.md
      - 1. 컴퓨터가 배운다는 생각: llm/01-learning.md
      - 2. 실패와 긴 겨울: llm/02-ai-winter.md
      - 3. 데이터를 통해 규칙을 찾기: llm/03-machine-learning.md
      - 4. 층을 깊게 쌓다: llm/04-deep-learning.md
      - 5. 언어를 숫자로 다루기: llm/05-embeddings.md
      - 6. 중요한 부분을 고르기: llm/06-attention.md
      - 7. Transformer와 대규모 사전학습: llm/07-transformer.md
      - 8. 사람의 의도에 맞추기: llm/08-alignment.md
      - 9. 오늘의 LLM과 한계: llm/09-modern-llms.md
  - 사전 학습:
      - 시작하기 전에: prerequisites/index.md
      - 개발 환경:
          - 터미널: prerequisites/terminal.md
          - 터미널 기본 명령어: prerequisites/terminal-commands.md
          - VS Code: prerequisites/vscode.md
      - 웹의 구조:
          - 웹 서비스란?: prerequisites/web-service.md
          - 인터넷: prerequisites/internet.md
          - 클라이언트-서버 모델: prerequisites/client-server.md
          - HTTP: prerequisites/http.md
          - HTML: prerequisites/html.md
          - "HTTP 메시지": prerequisites/http-message.md
          - URL: prerequisites/url.md
          - HTTP Method: prerequisites/http-method.md
          - REST API: prerequisites/rest-api.md
          - HTTP 상태 코드: prerequisites/http-status-codes.md
          - HTTPS: prerequisites/https.md
      - 네트워크:
          - IP와 Port: prerequisites/ip-port.md
          - DNS: prerequisites/dns.md
          - Localhost: prerequisites/localhost.md
      - Python:
          - Python 가상환경: prerequisites/python-virtual-environment.md
  - FastAPI 기초:
      - 1. 과정 소개:
          - 이 과정에서 배우는 것: fastapi/01-introduction/what-you-learn.md
          - 최종 결과물: fastapi/01-introduction/final-project.md
      - 2. FastAPI 소개: fastapi/02-about.md
      - 3. FastAPI 기초: fastapi/03-api-basics.md
      - 4. 기본 CRUD 구현: fastapi/04-crud.md
      - 5. 데이터베이스 활용: fastapi/05-database.md
      - 6. 회원가입: fastapi/06-sign-up.md
      - "7. 로그인과 인증: JWT": fastapi/07-jwt-authentication.md
      - A. 웹 화면 만들기: fastapi/a-web-page.md
      - "B. MySQL & PostgreSQL 설정": fastapi/b-databases.md
      - C. Pydantic 심화: fastapi/c-pydantic-advanced.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
  - javascripts/mermaid.js

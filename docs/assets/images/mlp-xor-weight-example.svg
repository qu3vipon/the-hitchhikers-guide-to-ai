<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 35 760 280" role="img" aria-labelledby="title desc">
  <title id="title">가중치와 편향으로 XOR 규칙을 처리하는 다층 퍼셉트론</title>
  <desc id="desc">x1과 x2가 모두 1일 때 두 은닉 뉴런과 출력 뉴런이 각각 계산하는 과정을 보인다.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="180" y1="105" x2="370" y2="105" stroke="#3d789d" stroke-width="2"/>
    <line x1="180" y1="105" x2="370" y2="245" stroke="#76a7c4" stroke-width="2"/>
    <line x1="180" y1="245" x2="370" y2="105" stroke="#3d789d" stroke-width="2"/>
    <line x1="180" y1="245" x2="370" y2="245" stroke="#76a7c4" stroke-width="2"/>
    <line x1="430" y1="105" x2="590" y2="175" stroke="#3d789d" stroke-width="2"/>
    <line x1="430" y1="245" x2="590" y2="175" stroke="#76a7c4" stroke-width="2"/>
    <line x1="400" y1="57" x2="400" y2="75" stroke="#c7834c" stroke-width="2"/>
    <line x1="400" y1="197" x2="400" y2="215" stroke="#c7834c" stroke-width="2"/>
    <line x1="620" y1="127" x2="620" y2="145" stroke="#c7834c" stroke-width="2"/>
  </g>
  <g fill="#3d789d" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="235" y="88">+2</text>
    <text x="235" y="224">−2</text>
  </g>
  <g fill="#76a7c4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="235" y="132">−2</text>
    <text x="235" y="270">+2</text>
  </g>
  <g fill="#3d789d" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="510" y="125">+1</text>
  </g>
  <g fill="#76a7c4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="510" y="234">+1</text>
  </g>
  <g fill="#c7834c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="440" y="65">b = −1</text>
    <text x="440" y="205">b = −1</text>
    <text x="660" y="138">b = 0</text>
  </g>
  <g stroke-width="2.5">
    <circle cx="150" cy="105" r="30" fill="#ffffff" stroke="#8b989e"/>
    <circle cx="150" cy="245" r="30" fill="#ffffff" stroke="#8b989e"/>
    <circle cx="400" cy="105" r="30" fill="#ffffff" stroke="#8b989e"/>
    <circle cx="400" cy="245" r="30" fill="#ffffff" stroke="#8b989e"/>
    <circle cx="620" cy="175" r="30" fill="#ffffff" stroke="#8b989e"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="150" y="111" font-size="18" font-weight="700">1</text>
    <text x="150" y="251" font-size="18" font-weight="700">1</text>
    <text x="400" y="111" font-size="18" font-weight="700">0</text>
    <text x="400" y="251" font-size="18" font-weight="700">0</text>
    <text x="620" y="181" font-size="18" font-weight="700">0</text>
  </g>
  <text x="400" y="302" fill="#536268" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ReLU(−1) = 0</text>
  <text x="620" y="236" fill="#536268" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ReLU(0) = 0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 32 720 262" role="img" aria-labelledby="title desc">
  <title id="title">RNN 인코더와 디코더를 이용한 기계 번역</title>
  <desc id="desc">인코더 RNN이 나는 커피를 마신다를 순서대로 읽어 문맥 벡터를 만들고, 디코더 RNN이 I drink coffee를 순서대로 생성한다.</desc>
  <defs>
    <marker id="black-arrow" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#43525a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="flow-arrow" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c7834c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dashed-arrow" markerWidth="5" markerHeight="5" viewBox="0 0 10 10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#718087" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">
    <text x="71" y="230" fill="#4686bb">인코더</text><text x="385" y="230" fill="#3d8b75">디코더</text>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" font-size="14" font-weight="650" text-anchor="middle">
    <text x="412" y="282">I</text><text x="482" y="282">drink</text><text x="552" y="282">coffee</text><text x="622" y="282">&lt;eos&gt;</text>
  </g>
  <rect x="55" y="102" width="226" height="140" rx="16" fill="none" stroke="#5e9ccf" stroke-width="2.5"/>
  <rect x="369" y="102" width="296" height="140" rx="16" fill="none" stroke="#65a88f" stroke-width="2.5"/>
  <g fill="none" stroke="#c7834c" stroke-width="2" stroke-linecap="round" marker-end="url(#flow-arrow)">
    <line x1="126" y1="172" x2="140" y2="172"/><line x1="196" y1="172" x2="210" y2="172"/><line x1="266" y1="172" x2="298" y2="172"/><line x1="352" y1="172" x2="384" y2="172"/><line x1="440" y1="172" x2="454" y2="172"/><line x1="510" y1="172" x2="524" y2="172"/><line x1="580" y1="172" x2="594" y2="172"/>
  </g>
  <g fill="#fff4e9" stroke="#c7834c" stroke-width="2.2">
    <rect x="71" y="136" width="54" height="72" rx="12"/><rect x="141" y="136" width="54" height="72" rx="12"/><rect x="211" y="136" width="54" height="72" rx="12"/><rect x="385" y="136" width="54" height="72" rx="12"/><rect x="455" y="136" width="54" height="72" rx="12"/><rect x="525" y="136" width="54" height="72" rx="12"/><rect x="595" y="136" width="54" height="72" rx="12"/>
  </g>
  <rect x="299" y="140" width="52" height="64" rx="12" fill="#f1ecf8" stroke="#806aa8" stroke-width="2.2"/>
  <g fill="#4f3f71" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><text x="325" y="166">문맥</text><text x="325" y="184">벡터</text></g>
  <g fill="#eef5f8" stroke="#3d789d" stroke-width="1.8">
    <rect x="68" y="40" width="60" height="32" rx="9"/><rect x="138" y="40" width="60" height="32" rx="9"/><rect x="208" y="40" width="60" height="32" rx="9"/><rect x="382" y="40" width="60" height="32" rx="9"/><rect x="452" y="40" width="60" height="32" rx="9"/><rect x="522" y="40" width="60" height="32" rx="9"/><rect x="592" y="40" width="60" height="32" rx="9"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" font-size="14" font-weight="650" text-anchor="middle">
    <text x="98" y="62">나는</text><text x="168" y="62">커피를</text><text x="238" y="62">마신다</text><text x="412" y="62">&lt;sos&gt;</text><text x="482" y="62">I</text><text x="552" y="62">drink</text><text x="622" y="62">coffee</text>
  </g>
  <g fill="none" stroke="#718087" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 5" marker-end="url(#dashed-arrow)">
    <path d="M412 267 C412 248 447 236 447 198 L447 98 C447 88 464 82 474 74"/><path d="M482 267 C482 248 517 236 517 198 L517 98 C517 88 534 82 544 74"/><path d="M552 267 C552 248 587 236 587 198 L587 98 C587 88 604 82 614 74"/>
  </g>
  <g fill="none" stroke="#43525a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#black-arrow)">
    <line x1="98" y1="73" x2="98" y2="135"/><line x1="168" y1="73" x2="168" y2="135"/><line x1="238" y1="73" x2="238" y2="135"/><line x1="412" y1="73" x2="412" y2="135"/><line x1="482" y1="73" x2="482" y2="135"/><line x1="552" y1="73" x2="552" y2="135"/><line x1="622" y1="73" x2="622" y2="135"/><line x1="412" y1="242" x2="412" y2="267"/><line x1="482" y1="242" x2="482" y2="267"/><line x1="552" y1="242" x2="552" y2="267"/><line x1="622" y1="242" x2="622" y2="267"/>
  </g>
</svg>

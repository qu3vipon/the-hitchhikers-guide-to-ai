<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320" role="img" aria-labelledby="title desc">
  <title id="title">n개의 입력과 m개의 출력을 가진 신경망</title>
  <desc id="desc">입력 x₁, x₂, xₙ과 출력 y₁, y₂, yₘ이 여러 연결로 이어진 신경망이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#5a6670"/></marker>
  </defs>
  <g>
    <rect x="65" y="30" width="110" height="270" rx="8" fill="#e8f2f6"/>
    <rect x="485" y="30" width="110" height="270" rx="8" fill="#f8e9e4"/>
  </g>
  <g fill="none" stroke="#5a6670" stroke-width="2.25" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="150" y1="70" x2="510" y2="70"/><line x1="150" y1="70" x2="510" y2="130"/><line x1="150" y1="70" x2="510" y2="250"/>
    <line x1="150" y1="130" x2="510" y2="70"/><line x1="150" y1="130" x2="510" y2="130"/><line x1="150" y1="130" x2="510" y2="250"/>
    <line x1="150" y1="250" x2="510" y2="70"/><line x1="150" y1="250" x2="510" y2="130"/><line x1="150" y1="250" x2="510" y2="250"/>
  </g>
  <g fill="#ffffff" stroke="#26353a" stroke-width="3">
    <circle cx="120" cy="70" r="30"/><circle cx="120" cy="130" r="30"/><circle cx="120" cy="250" r="30"/>
    <circle cx="540" cy="70" r="30"/><circle cx="540" cy="130" r="30"/><circle cx="540" cy="250" r="30"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="120" y="76">x₁</text><text x="120" y="136">x₂</text><text x="120" y="256">xₙ</text>
    <text x="540" y="76">y₁</text><text x="540" y="136">y₂</text><text x="540" y="256">yₘ</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="120" y="20" fill="#2d6e91">입력층</text>
    <text x="540" y="20" fill="#a5533b">출력층</text>
  </g>
  <g fill="#536268" font-family="system-ui, sans-serif" font-size="30" text-anchor="middle"><text x="120" y="190" dominant-baseline="middle">⋮</text><text x="540" y="190" dominant-baseline="middle">⋮</text></g>
</svg>

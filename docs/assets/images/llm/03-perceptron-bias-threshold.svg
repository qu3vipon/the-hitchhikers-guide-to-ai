<svg xmlns="http://www.w3.org/2000/svg" width="660" height="210" viewBox="0 -33 660 210" role="img" aria-labelledby="title desc">
  <title id="title">편향이 가중합 점수를 왼쪽으로 이동시키는 효과</title>
  <desc id="desc">편향을 더하기 전 가중합 1점과 3점이 점선 화살표를 따라 각각 최종 평가 점수 -1점과 1점으로 왼쪽 이동한다. 위쪽 1점은 무료 문구가 없는 모르는 발신자의 메일, 3점은 무료 문구가 있는 모르는 발신자의 메일이다. 0점 판단 기준의 왼쪽은 정상, 오른쪽은 스팸이다.</desc>

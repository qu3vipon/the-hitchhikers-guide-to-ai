<text class="math" x="320" y="174">1</text>
<g transform="translate(495 171)" stroke="#393630" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 -20 C2 -22 9 -15 8 -7 C9 2 -3 5 -8 0 C-14 -5 -14 -17 -8 -20 Z M-22 24 Q-22 4 -5 4 Q12 4 13 24 Z" fill="#e7efdf"/><path d="M16 -4 L22 2 L32 -11" fill="none" stroke="#2c7a64"/></g>
<text x="495" y="217" style="font-size:18px">아는 발신자</text>
<path class="ink" d="M550 174 Q577 172 604 174 M595 167 L605 174 L595 181"/>

    <path d="M311 138 Q329 134 350 138 L351 166 Q331 170 311 165 Z"/>
    <path d="M368 137 Q387 134 408 139 L409 167 Q389 170 369 165 Z"/>
    <path d="M426 140 Q446 137 466 142 L467 170 Q447 173 427 168 Z"/>

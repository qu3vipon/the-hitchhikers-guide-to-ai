<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 20 760 410" role="img" aria-labelledby="title desc">
<title id="title">위치의 시간에 대한 변화율은 순간 속도</title><desc id="desc">자동차의 아주 작은 위치 변화와 시계 바늘의 아주 짧은 시간 변화를 보여줍니다. 시간 간격을 한없이 줄이면 위치의 시간에 대한 변화율 dx/dt가 순간 속도가 됩니다.</desc>

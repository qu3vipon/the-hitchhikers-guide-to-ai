<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 8 720 280" role="img" aria-labelledby="title desc">
  <title id="title">회귀 연결을 가진 RNN 구조</title>
  <desc id="desc">입력층의 값이 은닉층을 거쳐 출력층으로 전달되고, 은닉층의 결과가 다음 단계의 계산에 다시 사용되는 구조다.</desc>
  <defs>
    <marker id="recurrent-arrow" markerWidth="6" markerHeight="6" viewBox="0 0 8 8" refX="7" refY="4" orient="90">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#806aa8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8b989e" stroke-linejoin="round" stroke-width="2" stroke-dasharray="5 5" opacity="0.65">
    <rect x="300" y="50" width="120" height="220" rx="16"/>
  </g>
  <g fill="none" stroke="#3d789d" stroke-linecap="round" stroke-width="2" opacity="0.55">
    <line x1="190" y1="116" x2="330" y2="92"/><line x1="190" y1="116" x2="330" y2="160"/><line x1="190" y1="116" x2="330" y2="228"/>
    <line x1="190" y1="204" x2="330" y2="92"/><line x1="190" y1="204" x2="330" y2="160"/><line x1="190" y1="204" x2="330" y2="228"/>
    <line x1="390" y1="92" x2="530" y2="160"/><line x1="390" y1="160" x2="530" y2="160"/><line x1="390" y1="228" x2="530" y2="160"/>
  </g>
  <g stroke-width="2.5">
    <circle cx="160" cy="116" r="30" fill="#eef5f8" stroke="#3d789d"/>
    <circle cx="160" cy="204" r="30" fill="#eef5f8" stroke="#3d789d"/>
    <circle cx="360" cy="92" r="30" fill="#fff4e9" stroke="#c7834c"/>
    <circle cx="360" cy="160" r="30" fill="#fff4e9" stroke="#c7834c"/>
    <circle cx="360" cy="228" r="30" fill="#fff4e9" stroke="#c7834c"/>
    <circle cx="560" cy="160" r="30" fill="#edf7f2" stroke="#3d8b75"/>
  </g>
  <path d="M420 75 A30 30 0 1 0 400 50" fill="none" stroke="#806aa8" stroke-width="2.4" stroke-linecap="round" marker-end="url(#recurrent-arrow)"/>
  <text x="462" y="70" fill="#806aa8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">h<tspan baseline-shift="super" font-size="10">(t−1)</tspan></text>
  <g fill="#26353a" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="160" y="40" font-size="16" font-weight="700">입력층</text>
    <text x="360" y="40" font-size="16" font-weight="700">은닉층</text>
    <text x="560" y="40" font-size="16" font-weight="700">출력층</text>
    <text x="160" y="122" font-size="18" font-weight="700">x₁<tspan baseline-shift="super" font-size="11">(t)</tspan></text>
    <text x="160" y="210" font-size="18" font-weight="700">x₂<tspan baseline-shift="super" font-size="11">(t)</tspan></text>
    <text x="360" y="98" font-size="15" font-weight="700">h₁<tspan baseline-shift="super" font-size="9">(t)</tspan></text>
    <text x="360" y="166" font-size="15" font-weight="700">h₂<tspan baseline-shift="super" font-size="9">(t)</tspan></text>
    <text x="360" y="234" font-size="15" font-weight="700">h₃<tspan baseline-shift="super" font-size="9">(t)</tspan></text>
    <text x="560" y="166" font-size="18" font-weight="700">y</text>
  </g>
</svg>

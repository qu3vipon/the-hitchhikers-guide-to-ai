<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 45 640 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">두 벡터의 내적</title>
  <desc id="desc">3차원 좌표 공간에서 비슷한 방향을 가리키는 입력 벡터와 가중치 벡터, 그리고 두 벡터 사이의 각도</desc>
  <defs>

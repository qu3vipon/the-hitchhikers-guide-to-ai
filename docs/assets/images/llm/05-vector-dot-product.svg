    <marker id="arrow-input" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#4d88a9"/>
    </marker>
    <marker id="arrow-weight" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#c7834c"/>
    </marker>
  </defs>

  <path d="M320 238L140 268" stroke="#7d8a90" stroke-width="1.6" marker-end="url(#arrow-axis)"/>

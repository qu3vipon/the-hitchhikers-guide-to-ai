  <path d="M320 238L435 185" stroke="#c7834c" stroke-width="2.5" marker-end="url(#arrow-weight)"/>
  <path d="M344 211A36 36 0 0 1 353 223" stroke="#8b989e" stroke-width="1.3"/>

<title id="title">여러 표현에서 토큰 조각 공유하기</title><desc id="desc">마신다, 마셨다, 마시겠지만을 작은 조각으로 나누어 반복되는 마와 다를 같은 색으로 표시한 개념 예시입니다. 실제 토큰 분할은 토큰화 방법에 따라 달라집니다.</desc>

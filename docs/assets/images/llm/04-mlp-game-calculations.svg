<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
<title id="title">협동 게임을 판단하는 다층 퍼셉트론의 계산</title><desc id="desc">h₁은 0, h₂는 1, 최종 출력 y는 1로 계산됩니다.</desc>
<style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print',cursive;font-size:25px;text-anchor:middle;stroke:#393630;stroke-width:.35;paint-order:stroke fill}.sub{font-size:17px;dominant-baseline:alphabetic}</style>
<g transform="translate(-25 0)"><text x="55" y="48" style="text-anchor:start;fill:#3d789d;stroke:#3d789d">h<tspan class="sub" dy="7">1</tspan></text><text x="102" y="48" style="fill:#3d789d;stroke:#3d789d">=</text><text x="127" y="48" style="text-anchor:start;fill:#3d789d;stroke:#3d789d">φ((−1 × 1) + (−1 × 1) + 0.5) = φ(−1.5) = 0</text><text x="55" y="108" style="text-anchor:start;fill:#3d8b75;stroke:#3d8b75">h<tspan class="sub" dy="7">2</tspan></text><text x="102" y="108" style="fill:#3d8b75;stroke:#3d8b75">=</text><text x="127" y="108" style="text-anchor:start;fill:#3d8b75;stroke:#3d8b75">φ((1 × 1) + (1 × 1) − 1.5) = φ(0.5) = 1</text><text x="55" y="168" style="text-anchor:start;fill:#a65043;stroke:#a65043">y</text><text x="102" y="168" style="fill:#a65043;stroke:#a65043">=</text><text x="127" y="168" style="text-anchor:start;fill:#a65043;stroke:#a65043">φ((1 × 0) + (1 × 1) − 0.5) = φ(0.5) = 1</text></g></svg>
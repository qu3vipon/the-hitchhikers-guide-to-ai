<svg xmlns="http://www.w3.org/2000/svg" width="760" height="135" viewBox="0 0 760 135" role="img" aria-labelledby="title desc"><title id="title">여러 은닉층을 거쳐 손실까지 이어지는 계산 경로</title><desc id="desc">가중치 w가 가중합 z와 여러 은닉층의 값 h⁽¹⁾부터 h⁽ᵏ⁾를 거쳐 출력 y와 손실 L에 영향을 주는 한 경로입니다. h의 괄호 안의 위첨자는 은닉층의 순서를 나타냅니다.</desc><style>text { fill:#393630; font-family:'Chalkboard SE','Segoe Print',cursive; font-size:30px; text-anchor:middle; } .ink { fill:none; stroke:#393630; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }.label { font-family:'Chalkboard SE','Segoe Print','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',cursive; font-size:20px; }</style>

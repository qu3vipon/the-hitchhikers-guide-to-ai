<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 가중치를 사용하는 세 함수</title>
<desc id="desc">세 함수는 동일한 입력 x₁, x₂, x₃에 서로 다른 가중치를 곱해 각각 y₁, y₂, y₃을 계산합니다.</desc>
<style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print',cursive;font-size:25px;text-anchor:middle;dominant-baseline:alphabetic}.sub{font-size:17px;dominant-baseline:alphabetic}.weight{fill:#2d6e91}</style>
<text x="380" y="48">y<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan> = f<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan> (x<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan>) = (<tspan class="weight">0.4</tspan>x<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan>) + (<tspan class="weight">0.8</tspan>x<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan>) + (<tspan class="weight">0.1</tspan>x<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan>)</text>
<text x="380" y="108">y<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan> = f<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan> (x<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan>) = (<tspan class="weight">0.9</tspan>x<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan>) + (<tspan class="weight">0.3</tspan>x<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan>) + (<tspan class="weight">0.7</tspan>x<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan>)</text>
<text x="380" y="168">y<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan> = f<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan> (x<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan>) = (<tspan class="weight">0.8</tspan>x<tspan class="sub" dy="7">1</tspan><tspan dy="-7">&#8203;</tspan>) + (<tspan class="weight">0.4</tspan>x<tspan class="sub" dy="7">2</tspan><tspan dy="-7">&#8203;</tspan>) + (<tspan class="weight">0.2</tspan>x<tspan class="sub" dy="7">3</tspan><tspan dy="-7">&#8203;</tspan>)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" role="img" aria-labelledby="title desc">
  <title id="title">뜨거운 냄비에서 손을 떼기까지의 신호 전달</title>
  <desc id="desc">뜨거움을 감지한 감각 뉴런의 정보가 중간 뉴런들을 거쳐 운동 뉴런으로 전달되고, 근육이 움직여 손을 뗀다. 이 도식은 여러 뉴런을 거치는 과정을 단순화한 것이다.</desc>
  <style>
    .ink { fill: none; stroke: #393630; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .echo { fill: none; stroke: #393630; stroke-width: 1; opacity: .28; stroke-linecap: round; }
    text { fill: #393630; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 15px; text-anchor: middle; }
    .neuron { font-weight: 600; dominant-baseline: central; }
  </style>

<path class="ink back" d="M660 210 Q380 213 100 210 M111 203 L99 210 L111 217"/>
<text x="380" y="247" style="fill:#a65043">역전파 · 손실의 변화율을 거꾸로 전달하며 계산</text>
</svg>

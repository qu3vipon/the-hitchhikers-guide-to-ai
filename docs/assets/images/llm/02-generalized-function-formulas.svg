<svg xmlns="http://www.w3.org/2000/svg" width="760" height="265" viewBox="0 0 760 265" role="img" aria-labelledby="title desc">
<title id="title">n개의 입력에서 m개의 출력을 계산하는 함수</title>
<desc id="desc">각 함수는 n개의 입력에 각기 다른 가중치를 곱해 합산합니다.</desc>
<style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print',cursive;font-size:25px;text-anchor:middle;dominant-baseline:alphabetic}.sub{font-size:17px;dominant-baseline:alphabetic}.input{fill:#2d6e91}.output{fill:#a5533b}</style>
<text x="380" y="48">f<tspan class="sub" dy="7"><tspan class="output">1</tspan></tspan><tspan dy="-7">&#8203;</tspan> (x<tspan class="sub" dy="7"><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7"><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>, …, x<tspan class="sub" dy="7"><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>) = (w<tspan class="sub" dy="7"><tspan class="output">1</tspan><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>) + (w<tspan class="sub" dy="7"><tspan class="output">1</tspan><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>) + … + (w<tspan class="sub" dy="7"><tspan class="output">1</tspan><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>)</text>
<text x="380" y="108">f<tspan class="sub" dy="7"><tspan class="output">2</tspan></tspan><tspan dy="-7">&#8203;</tspan> (x<tspan class="sub" dy="7"><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7"><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>, …, x<tspan class="sub" dy="7"><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>) = (w<tspan class="sub" dy="7"><tspan class="output">2</tspan><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>) + (w<tspan class="sub" dy="7"><tspan class="output">2</tspan><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>) + … + (w<tspan class="sub" dy="7"><tspan class="output">2</tspan><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>)</text>
<text x="380" y="228">f<tspan class="sub" dy="7"><tspan class="output">m</tspan></tspan><tspan dy="-7">&#8203;</tspan> (x<tspan class="sub" dy="7"><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>, x<tspan class="sub" dy="7"><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>, …, x<tspan class="sub" dy="7"><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>) = (w<tspan class="sub" dy="7"><tspan class="output">m</tspan><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">1</tspan></tspan><tspan dy="-7">&#8203;</tspan>) + (w<tspan class="sub" dy="7"><tspan class="output">m</tspan><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">2</tspan></tspan><tspan dy="-7">&#8203;</tspan>) + … + (w<tspan class="sub" dy="7"><tspan class="output">m</tspan><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>x<tspan class="sub" dy="7"><tspan class="input">n</tspan></tspan><tspan dy="-7">&#8203;</tspan>)</text>
<text x="380" y="168" style="dominant-baseline:middle">⋮</text>
</svg>

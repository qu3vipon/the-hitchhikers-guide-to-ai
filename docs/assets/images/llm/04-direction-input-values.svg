<text x="147" y="61" style="font-size:18px">왼쪽 선택</text><path class="ink" d="M207 61 Q222 60 237 61 M229 55 L238 61 L229 67"/><text class="math" x="266" y="61">0</text>
<g transform="translate(56 154) scale(1.05 1.05)" fill="#fbefd5" stroke="#393630" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -5 L-12 -5 Q-8 -10 -2 -10 L20 -10 Q26 -10 26 -6 Q26 -2 20 -2 L7 -2 Q12 0 10 4 Q13 7 9 10 Q10 14 5 16 L-4 16 Q-10 16 -13 10 L-20 10 Z"/><path d="M-12 -5 L-12 10 M2 1 L8 2 M1 7 L8 8 M-1 12 L5 13" fill="none" stroke-width="1.2"/></g>
<text x="147" y="159" style="font-size:18px">오른쪽 선택</text><path class="ink" d="M207 159 Q222 158 237 159 M229 153 L238 159 L229 165"/><text class="math" x="266" y="159">1</text>

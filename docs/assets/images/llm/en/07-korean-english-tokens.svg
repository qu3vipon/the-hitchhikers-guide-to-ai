<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="title desc"><title id="title">Different tokenizers can split the same text differently</title><desc id="desc">Illustrative tokenizations of I drank coffee produce either five fragments or three complete-word tokens.</desc><style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print',sans-serif;font-size:23px}.ink{fill:none;stroke:#393630;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}</style><text x="25" y="59" style="font-size:19px">Tokenizer A</text><path d="M185 28 Q220.0 26 255 28 L256 77 Q220.0 79 185 77Z" fill="#e5eef5" stroke="#393630" stroke-width="1.8"/><text x="220.0" y="59" text-anchor="middle">I</text><path d="M265 28 Q300.0 26 335 28 L336 77 Q300.0 79 265 77Z" fill="#e5eef5" stroke="#393630" stroke-width="1.8"/><text x="300.0" y="59" text-anchor="middle">dr</text><path d="M345 28 Q380.0 26 415 28 L416 77 Q380.0 79 345 77Z" fill="#e5eef5" stroke="#393630" stroke-width="1.8"/><text x="380.0" y="59" text-anchor="middle">ank</text><path d="M425 28 Q460.0 26 495 28 L496 77 Q460.0 79 425 77Z" fill="#e5eef5" stroke="#393630" stroke-width="1.8"/><text x="460.0" y="59" text-anchor="middle">cof</text><path d="M505 28 Q540.0 26 575 28 L576 77 Q540.0 79 505 77Z" fill="#e5eef5" stroke="#393630" stroke-width="1.8"/><text x="540.0" y="59" text-anchor="middle">fee</text><text x="610" y="59" style="font-size:18px">3 words → 5 tokens</text><text x="25" y="147" style="font-size:19px">Tokenizer B</text><path d="M185 116 Q247.5 114 310 116 L311 165 Q247.5 167 185 165Z" fill="#edf7f2" stroke="#393630" stroke-width="1.8"/><text x="247.5" y="147" text-anchor="middle">I</text><path d="M320 116 Q382.5 114 445 116 L446 165 Q382.5 167 320 165Z" fill="#edf7f2" stroke="#393630" stroke-width="1.8"/><text x="382.5" y="147" text-anchor="middle">drank</text><path d="M455 116 Q517.5 114 580 116 L581 165 Q517.5 167 455 165Z" fill="#edf7f2" stroke="#393630" stroke-width="1.8"/><text x="517.5" y="147" text-anchor="middle">coffee</text><text x="610" y="147" style="font-size:18px">3 words → 3 tokens</text></svg>
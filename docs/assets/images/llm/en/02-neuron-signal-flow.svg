    .ink { fill: none; stroke: #393630; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .echo { fill: none; stroke: #393630; stroke-width: 1; opacity: .28; stroke-linecap: round; }
    text { fill: #393630; font-family: 'Inter', 'Arial', sans-serif; font-size: 15px; text-anchor: middle; }
    .neuron { font-size: 14px; font-weight: 600; dominant-baseline: central; }
  </style>
  <g transform="translate(0 -24)">
  <path class="ink" d="M180 84 Q225 81 280 84 M270 77 L281 84 L270 91"/>
  <path class="ink" d="M380 84 Q431 81 480 84 M470 77 L481 84 L470 91"/>

<svg xmlns="http://www.w3.org/2000/svg" width="660" height="180" viewBox="0 0 660 180" role="img" aria-labelledby="title desc">
  <title id="title">Pulling a hand away from a hot pan</title>
  <desc id="desc">A simplified pathway carries a heat signal through sensory and intermediate neurons to a motor neuron, causing muscles to withdraw the hand.</desc>

  <path class="echo" d="M132 56 C149 54 159 69 162 83 C159 103 145 113 129 116 C111 113 102 99 98 85 C101 65 115 56 132 56 Z"/>
  </g>
  <g transform="translate(330 84) scale(1.4) translate(-330 -84)">
  <path d="M330 54 C347 53 361 67 360 84 C361 101 347 115 330 114 C313 115 299 101 300 84 C299 67 313 53 330 54 Z" fill="#e7eef0" stroke="#393630" stroke-width="2.5"/>
  <path class="echo" d="M332 56 C349 54 359 69 362 83 C359 103 345 113 329 116 C311 113 302 99 298 85 C301 65 315 56 332 56 Z"/>
  </g>
  <g transform="translate(530 84) scale(1.4) translate(-530 -84)">
  <path d="M530 54 C547 53 561 67 560 84 C561 101 547 115 530 114 C513 115 499 101 500 84 C499 67 513 53 530 54 Z" fill="#e7eef0" stroke="#393630" stroke-width="2.5"/>
  <path class="echo" d="M532 56 C549 54 559 69 562 83 C559 103 545 113 529 116 C511 113 502 99 498 85 C501 65 515 56 532 56 Z"/>
  </g>
  <text class="neuron" x="130" y="75">Sensory</text>
  <text class="neuron" x="130" y="93">neuron</text>
  <text class="neuron" x="330" y="84" style="font-size: 12px;">Interneurons</text>
  <text class="neuron" x="530" y="75">Motor</text>
  <text class="neuron" x="530" y="93">neuron</text>
  <text x="230" y="66" style="font-size: 13px;">Sensory signal</text>
  <text x="430" y="66" style="font-size: 13px;">Motor signal</text>
  <g transform="translate(72.4 46) scale(0.8)">
  <path d="M70 145 C59 144 57 136 61 130 L65 124 Q64 131 68 132 C66 125 74 122 72 115 C82 122 77 128 78 132 Q81 130 81 126 C88 135 83 145 74 145 Z" fill="#ef9a87" stroke="#a65043" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 142 Q65 139 68 135 Q72 132 72 128 Q78 134 77 138 Q76 142 73 143" fill="#fbd5a5" stroke="#a65043" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="130" y="186">Heat detected</text>
  <g transform="translate(46 20)">

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">n inputs and m functions</title>
  <desc id="desc">The same input vector is supplied to m functions.</desc>
  <style>
    text { fill: #393630; text-anchor: middle; dominant-baseline: central; }
    .math { font-family: 'Chalkboard SE', 'Segoe Print', cursive; font-size: 29px; dominant-baseline: alphabetic; }
    .sub { font-size: 20px; dominant-baseline: alphabetic; }
    .word { font-family: 'Inter', 'Arial', sans-serif; font-size: 22px; font-weight: 500; }
    .input { fill: #2d6e91; }
    .output { fill: #a5533b; }
    .ink { fill: none; stroke: #393630; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .echo { fill: none; stroke: #393630; stroke-width: 1; opacity: .28; }
  </style>
  <text class="math" x="171" y="138">f (x<tspan class="input sub" dy="8">1</tspan><tspan dy="-8">, x</tspan><tspan class="input sub" dy="8">2</tspan><tspan dy="-8">, …, x</tspan><tspan class="input sub" dy="8">n</tspan><tspan dy="-8">)</tspan></text>
  <text class="word" x="171" y="215"><tspan class="input">n</tspan> inputs</text>
  <path class="ink" d="M324 128 Q362 125 399 128 M388 119 L400 128 L388 137"/>
  <text class="math" x="470" y="65">f<tspan class="output sub" dy="8">1</tspan></text>
  <text class="math" x="470" y="134">f<tspan class="output sub" dy="8">2</tspan></text>
  <text class="math" x="470" y="176">⋮</text>
  <text class="math" x="470" y="240">f<tspan class="output sub" dy="8">m</tspan></text>
  <path class="ink" d="M541 29 L553 30 Q556 142 553 254 L541 255"/>
  <text class="word" x="649" y="143"><tspan class="output">m</tspan> functions</text>
</svg>

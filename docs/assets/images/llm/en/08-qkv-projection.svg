<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 8 720 280" role="img" aria-labelledby="title desc">
  <title id="title">A token vector is projected into query, key, and value vectors</title>
  <desc id="desc">A token vector is projected into query, key, and value vectors</desc>
  <g fill="none" stroke-linecap="round" stroke-width="2" opacity="0.65">
    <line x1="200" y1="160" x2="430" y2="92" stroke="#3d789d"/>
    <line x1="200" y1="160" x2="430" y2="160" stroke="#3d8b75"/>
    <line x1="200" y1="160" x2="430" y2="228" stroke="#b85c5c"/>
  </g>
  <g stroke-width="1.8">
    <rect x="290" y="109" width="62" height="28" rx="6" fill="#e5eef5" stroke="#3d789d"/>
    <rect x="290" y="146" width="62" height="28" rx="6" fill="#edf7f2" stroke="#3d8b75"/>
    <rect x="290" y="183" width="62" height="28" rx="6" fill="#f2dedb" stroke="#b85c5c"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="321" y="128">W<tspan baseline-shift="sub" font-size="9">Q</tspan></text>
    <text x="321" y="165">W<tspan baseline-shift="sub" font-size="9">K</tspan></text>
    <text x="321" y="202">W<tspan baseline-shift="sub" font-size="9">V</tspan></text>
  </g>
  <g stroke-width="2.5">
    <circle cx="170" cy="160" r="30" fill="#f0f2f3" stroke="#7d8a90"/>
    <circle cx="460" cy="92" r="30" fill="#e5eef5" stroke="#3d789d"/>
    <circle cx="460" cy="160" r="30" fill="#edf7f2" stroke="#3d8b75"/>
    <circle cx="460" cy="228" r="30" fill="#f2dedb" stroke="#b85c5c"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="170" y="40" font-size="16" font-weight="700">Token vector</text>
    <text x="460" y="40" font-size="16" font-weight="700">Q · K · V vectors</text>
    <text x="170" y="166" font-size="18" font-weight="700">x</text>
    <text x="460" y="98" font-size="18" font-weight="700">Q</text>
    <text x="460" y="166" font-size="18" font-weight="700">K</text>
    <text x="460" y="234" font-size="18" font-weight="700">V</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="650">
    <text x="508" y="97" fill="#3d789d">Q = XW<tspan baseline-shift="sub" font-size="9">Q</tspan></text>
    <text x="508" y="165" fill="#3d8b75">K = XW<tspan baseline-shift="sub" font-size="9">K</tspan></text>
    <text x="508" y="233" fill="#b85c5c">V = XW<tspan baseline-shift="sub" font-size="9">V</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="320" viewBox="-120 0 1160 320" role="img" aria-labelledby="title desc">
  <title id="title">Comparing weighted applicant scores</title>
  <desc id="desc">English, science, and math scores are 90, 90, 70 for A and 80, 80, 90 for B. Both raw totals are 250; doubling math gives 320 and 340.</desc>
  <style>
    text { fill: #393630; text-anchor: middle; dominant-baseline: central; }
    .word { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 22px; font-weight: 500; }
    .heading { font-size: 28px; font-weight: 600; }
    .math { font-family: 'Chalkboard SE', 'Segoe Print', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', cursive; font-size: 24px; font-weight: 500; }
    .raw { font-size: 21px; }
    .caption { font-size: 18px; fill: #716c64; }
    .ink { fill: none; stroke: #393630; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .echo { fill: none; stroke: #393630; stroke-width: 1; opacity: .28; stroke-linecap: round; }
  </style>
  <defs>
    <g id="person">
      <path d="M0 -24 C10 -25 17 -17 16 -8 C17 1 9 9 0 8 C-10 9 -17 1 -16 -8 C-17 -17 -9 -25 0 -24 Z" fill="#e7eef0" stroke="#393630" stroke-width="2.5" />
      <path class="ink" d="M-27 40 Q-27 16 -8 14 L8 14 Q28 16 27 40 Z" style="fill: #e7eef0;" />
      <path class="echo" d="M-25 41 Q-28 19 -7 17 L9 16 Q25 18 29 39" />
    </g>
  </defs>
  <text class="word" x="-50" style="font-size: 19px;" y="183">Raw score</text>
  <text class="word" x="-50" style="font-size: 19px;" y="276">Weighted sum</text>
  <use href="#person" transform="translate(183 60) scale(1.3)" />
  <use href="#person" transform="translate(703 60) scale(1.3)" />
  <text class="word heading" x="310" y="62">Applicant A</text>
  <text class="word heading" x="830" y="62">Applicant B</text>

  <text class="math raw" x="260" y="183">English 90 + Science 90 + Math 70 = 250</text>
  <text class="math raw" x="780" y="183">English 80 + Science 80 + Math 90 = 250</text>
  <path class="ink" d="M509 177 Q520 176 531 177 M509 189 Q520 188 531 189" />

  <g fill="none" stroke="#f5d5cf" stroke-width="14.40" stroke-linecap="butt" stroke-linejoin="round"><path d="M420.20 264.92 Q440.50 263.62 460.80 265.42" /><path d="M421.20 275.00 Q441.00 273.70 460.80 275.50" /><path d="M420.20 285.08 Q440.00 283.78 459.80 285.58" /></g><g fill="none" stroke="#f5d5cf" stroke-width="14.40" stroke-linecap="butt" stroke-linejoin="round"><path d="M940.20 264.92 Q960.50 263.62 980.80 265.42" /><path d="M941.20 275.00 Q961.00 273.70 980.80 275.50" /><path d="M940.20 285.08 Q960.00 283.78 979.80 285.58" /></g><text class="math" x="235" y="276">(90 × 1) + (90 × 1) + (70 <tspan fill="#a65043" font-weight="700">× 2</tspan>) =</text>
  <text class="math" x="440" y="276">320</text>
  <text class="math" x="755" y="276">(80 × 1) + (80 × 1) + (90 <tspan fill="#a65043" font-weight="700">× 2</tspan>) =</text>
  <text class="math" x="960" y="276">340</text>
  <path class="ink" d="M531 264 Q519 270 509 276 Q520 282 531 288" />
</svg>

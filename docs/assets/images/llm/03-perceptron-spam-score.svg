  <title id="title">스팸 메일을 위한 퍼셉트론의 가중합과 편향</title>
  <desc id="desc">무료라는 표현과 모르는 발신자라는 두 입력이 가중치와 함께 퍼셉트론으로 들어가고, 위쪽에서 편향 -2가 더해져 평가 점수 1이 만들어진다. 이 점수는 스팸으로 판단된다.</desc>

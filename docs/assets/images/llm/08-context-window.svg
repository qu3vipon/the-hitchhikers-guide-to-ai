<svg xmlns="http://www.w3.org/2000/svg" width="852" height="170" viewBox="0 0 852 170" role="img" aria-labelledby="title desc">
<title id="title">문맥 창에 포함된 단어의 범위</title><desc id="desc">나는 오늘 아침에 카페에서 커피를 마시고 회사로 갔다라는 문장을 설명을 위해 어절 단위로 나누고, 가운데 네 어절을 문맥 창으로 표시한 개념도입니다. 실제 문맥 창은 토큰 수를 기준으로 합니다.</desc>
<style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',cursive;font-size:18px}</style>
<text x="426" y="35" text-anchor="middle" style="fill:#3d789d;font-size:24px">문맥 창</text>
<path d="M230 70 L230 55 Q426 53 622 55 L622 70" fill="none" stroke="#3d789d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M34 83 Q83 81 118 84 L119 128 Q76 131 34 128 Z" fill="#f0f2f3" stroke="#b4bdc1" stroke-width="1.8" stroke-linejoin="round"/><text x="76" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#929b9e">나는</text><path d="M132 83 Q181 81 216 84 L217 128 Q174 131 132 128 Z" fill="#f0f2f3" stroke="#b4bdc1" stroke-width="1.8" stroke-linejoin="round"/><text x="174" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#929b9e">오늘</text><path d="M230 83 Q279 81 314 84 L315 128 Q272 131 230 128 Z" fill="#ffffff" stroke="#3d789d" stroke-width="1.8" stroke-linejoin="round"/><text x="272" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#393630">아침에</text><path d="M328 83 Q377 81 412 84 L413 128 Q370 131 328 128 Z" fill="#ffffff" stroke="#3d789d" stroke-width="1.8" stroke-linejoin="round"/><text x="370" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#393630">카페에서</text><path d="M426 83 Q475 81 510 84 L511 128 Q468 131 426 128 Z" fill="#ffffff" stroke="#3d789d" stroke-width="1.8" stroke-linejoin="round"/><text x="468" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#393630">커피를</text><path d="M524 83 Q573 81 608 84 L609 128 Q566 131 524 128 Z" fill="#ffffff" stroke="#3d789d" stroke-width="1.8" stroke-linejoin="round"/><text x="566" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#393630">마시고</text><path d="M622 83 Q671 81 706 84 L707 128 Q664 131 622 128 Z" fill="#f0f2f3" stroke="#b4bdc1" stroke-width="1.8" stroke-linejoin="round"/><text x="664" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#929b9e">회사로</text><path d="M720 83 Q769 81 804 84 L805 128 Q762 131 720 128 Z" fill="#f0f2f3" stroke="#b4bdc1" stroke-width="1.8" stroke-linejoin="round"/><text x="762" y="108" text-anchor="middle" dominant-baseline="middle" style="fill:#929b9e">갔다</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-labelledby="title desc">
<title id="title">한국어와 영어의 토큰 분할 예시</title><desc id="desc">커피를 마셨습니다는 커피, 를, 마시, 었, 습니다의 다섯 토큰으로, I drank coffee는 세 토큰으로 나누어 표현한 예시입니다. 실제 분할은 토큰화 방법에 따라 달라집니다.</desc>

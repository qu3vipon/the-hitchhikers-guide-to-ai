<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 -45 900 430" role="img" aria-labelledby="title desc">
  <title id="title">학습 데이터를 사용하는 에포크와 신경망의 학습률</title>
  <desc id="desc">왼쪽 학습 데이터를 위에서 아래로 모두 한 번 사용하면 1에포크다. 오른쪽은 두 입력 뉴런과 출력 뉴런으로 단순화한 신경망이다. 학습률 0.1을 적용해 가중치 하나를 0에서 0.1로 수정하는 예를 보여준다.</desc>
  <style>
    .label { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #393630; text-anchor: middle; font-size: 20.5px; }
    .ink { fill: none; stroke: #393630; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-labelledby="title desc">
<title id="title">Query, Key, Value의 역할</title><desc id="desc">Query는 현재 토큰이 찾는 정보, Key는 각 토큰이 관련된 정보로 Query와 비교하는 기준, Value는 각 토큰이 다른 토큰에 전달할 정보를 나타냅니다.</desc>
<style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',cursive;font-size:21px}.title{font-size:24px}</style>
<path d="M30 22 Q150 19 270 23 Q280 24 279 36 L280 175 Q278 190 266 188 Q150 191 32 187 Q20 186 21 173 L20 37 Q20 24 30 22 Z" fill="#e5eef5" stroke="#3d789d" stroke-width="2.2" stroke-linejoin="round"/><text x="150" y="62" text-anchor="middle" class="title" style="fill:#3d789d">쿼리(Query)</text><text x="150" y="106" text-anchor="middle">현재 토큰이</text><text x="150" y="137" text-anchor="middle">어떤 정보를 찾는가</text><path d="M310 22 Q430 19 550 23 Q560 24 559 36 L560 175 Q558 190 546 188 Q430 191 312 187 Q300 186 301 173 L300 37 Q300 24 310 22 Z" fill="#edf7f2" stroke="#3d8b75" stroke-width="2.2" stroke-linejoin="round"/><text x="430" y="62" text-anchor="middle" class="title" style="fill:#3d8b75">키(Key)</text><text x="430" y="106" text-anchor="middle">각 토큰이</text><text x="430" y="137" text-anchor="middle">어떤 정보와 관련 있는가</text><text x="430" y="169" text-anchor="middle" style="font-size:17px;fill:#3d8b75">Query와 비교해 관련도 계산</text><path d="M590 22 Q710 19 830 23 Q840 24 839 36 L840 175 Q838 190 826 188 Q710 191 592 187 Q580 186 581 173 L580 37 Q580 24 590 22 Z" fill="#f2dedb" stroke="#b85c5c" stroke-width="2.2" stroke-linejoin="round"/><text x="710" y="62" text-anchor="middle" class="title" style="fill:#b85c5c">값(Value)</text><text x="710" y="106" text-anchor="middle">각 토큰이 다른 토큰에</text><text x="710" y="137" text-anchor="middle">어떤 정보를 전달하는가</text></svg>

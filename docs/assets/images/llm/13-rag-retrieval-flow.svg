<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">RAG의 검색 증강 생성 흐름</title>
  <desc id="desc">사용자 질문을 검색 단계로 보내고, 데이터베이스에서 찾은 관련 정보를 질문과 함께 LLM에 전달하여 답변을 생성하는 흐름.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4f5862"/></marker>
    <style>
      .node { fill: #ffffff; stroke: #343a42; stroke-width: 2.5; stroke-linejoin: round; }
      .label { font-family: Arial, 'Noto Sans KR', sans-serif; fill: #20252b; text-anchor: middle; dominant-baseline: middle; }
      .main { font-size: 25px; font-weight: 600; }
      .sub { font-size: 19px; }
      .edge { fill: none; stroke: #4f5862; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font-family: Arial, 'Noto Sans KR', sans-serif; fill: #4f5862; font-size: 18px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(40 -24)">
  <path class="node" d="M60 98 H210 L180 262 H30 Z"/>
  <text x="120" y="164" class="label main">사용자 질문</text>
  <text x="120" y="198" class="label sub">&quot;휴가 규정 알려줘&quot;</text>

  <g transform="translate(-15 0)">
  <rect x="320" y="98" width="190" height="164" rx="8" class="node"/>
  <text x="415" y="180" class="label main">검색</text>

  <rect x="640" y="98" width="190" height="164" rx="8" fill="#303b45" stroke="#303b45" stroke-width="2.5"/>
  <text x="735" y="180" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">LLM</text>

  <path class="node" d="M965 98 H1105 L1075 262 H935 Z"/>
  <text x="1020" y="164" class="label main">답변</text>
  <text x="1020" y="198" class="label sub">&quot;휴가는 …&quot;</text>

  <path d="M210 180 H320" class="edge"/>
  <text x="265" y="163" class="edge-label">1. 질문</text>

  <path d="M510 180 H640" class="edge"/>
  <text x="575" y="163" class="edge-label">4. 질문 + 문서</text>

  <path d="M830 180 H950" class="edge"/>
  <text x="890" y="163" class="edge-label">5. 답변 생성</text>

  <path d="M385 262 V377" class="edge"/>
  <text x="347" y="329" class="edge-label">2. 검색</text>

  <ellipse cx="415" cy="399" rx="78" ry="22" class="node"/>
  <path d="M337 399 V496 C337 509 372 519 415 519 C458 519 493 509 493 496 V399" class="node"/>
  <path d="M337 399 C337 428 493 428 493 399" fill="none" stroke="#343a42" stroke-width="2.5"/>
  <path d="M337 496 C337 509 372 519 415 519 C458 519 493 509 493 496" fill="none" stroke="#343a42" stroke-width="2.5"/>
  <text x="415" y="454" class="label main">사내 문서</text>
  <text x="415" y="484" class="label main">데이터베이스</text>

  <path d="M445 377 V262" class="edge"/>
  <text x="525" y="329" class="edge-label">3. 문서(휴가 규정)</text>
  </g>
  </g>
</svg>

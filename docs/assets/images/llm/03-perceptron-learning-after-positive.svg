<svg xmlns="http://www.w3.org/2000/svg" width="660" height="230" viewBox="0 35 660 230" role="img" aria-labelledby="title desc">
  <title id="title">스팸 메일 오류를 반영한 퍼셉트론</title>
  <desc id="desc">무료라는 표현과 모르는 발신자라는 두 입력의 가중치와 편향을 각각 1로 높인 뒤 평가 점수 3이 되어 스팸으로 예측한다.</desc>
  <g fill="none" stroke-linecap="round">
    <path stroke="#3d789d" stroke-width="2.25" d="M171 82 Q290.135 113.455 410 142 M403.21 136.17 L410 142 L401.27 143.93" stroke-linecap="round" stroke-linejoin="round" />
    <path stroke="#93b6ca" stroke-width="2.25" d="M171 196 Q290.736 178.481 410 158 M401.47 155.31 L410 158 L402.73 163.21" stroke-linecap="round" stroke-linejoin="round" />
    <path stroke="#c7834c" stroke-width="2.25" d="M440 82 Q439.62 101 440 120 M444.00 112.00 L440 120 L436.00 112.00" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g fill="#e7eef0" stroke="#393630" stroke-width="2.5">
    <path d="M141 52 C157.8 51 172 65.2 171 82 C172 98.8 157.8 113 141 112 C124.2 113 110 98.8 111 82 C110 65.2 124.2 51 141 52 Z" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M141 166 C157.8 165 172 179.2 171 196 C172 212.8 157.8 227 141 226 C124.2 227 110 212.8 111 196 C110 179.2 124.2 165 141 166 Z" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M440 120 C456.8 119 471 133.2 470 150 C471 166.8 456.8 181 440 180 C423.2 181 409 166.8 410 150 C409 133.2 423.2 119 440 120 Z" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g fill="#393630" font-family="Chalkboard SE, Segoe Print, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, cursive" text-anchor="middle">
    <text x="141" y="88" font-size="18">1</text>
    <text x="141" y="202" font-size="18">1</text>
    <text x="440" y="156" font-size="18">3</text>
  </g>
  <g fill="#393630" font-family="Chalkboard SE, Segoe Print, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, cursive">
    <text x="100" y="88" font-size="18" text-anchor="end">x₁</text>
    <text x="141" y="131" font-size="13" text-anchor="middle">“무료” 포함</text>
    <text x="100" y="202" font-size="18" text-anchor="end">x₂</text>
    <text x="141" y="245" font-size="13" text-anchor="middle">모르는 발신자</text>
  </g>
  <g font-family="Chalkboard SE, Segoe Print, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, cursive" font-size="15" font-weight="700" text-anchor="middle">
    <text x="276" y="96" fill="#3d789d">w₁ = 1</text>
    <text x="276" y="169" fill="#93b6ca">w₂ = 1</text>
    <text x="440" y="70" fill="#c7834c">편향 1</text>
  </g>
  <text x="500" y="156" fill="#2c7a64" font-family="Chalkboard SE, Segoe Print, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, cursive" font-size="16" font-weight="700">예측 성공</text>
</svg>

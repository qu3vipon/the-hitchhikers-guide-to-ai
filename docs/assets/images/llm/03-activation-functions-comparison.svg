<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">계단 함수, 시그모이드, ReLU 활성화 함수 비교</title>
  <desc id="desc">세 그래프가 입력값 z에 따른 출력을 비교한다. 계단 함수는 0에서 1로 갑자기 바뀌고, 시그모이드는 부드러운 S자 곡선이며, ReLU는 음수에서 0이고 양수에서 직선으로 증가한다.</desc>
  <g fill="#ffffff" stroke="#d5dde0" stroke-width="1.5">

    <path d="M258 10 Q360 9 462 10 Q470 10 470 18 L470 242 Q470 250 462 250 Q360 251 258 250 Q250 250 250 242 L250 18 Q250 10 258 10 Z" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M498 10 Q600 9 702 10 Q710 10 710 18 L710 242 Q710 250 702 250 Q600 251 498 250 Q490 250 490 242 L490 18 Q490 10 498 10 Z" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g fill="#393630" font-family="Chalkboard SE, Segoe Print, Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, cursive" text-anchor="middle">
    <text x="120" y="39" font-size="16" font-weight="700">계단 함수</text>
    <text x="120" y="58" font-size="13">Step function</text>
    <text x="360" y="39" font-size="16" font-weight="700">시그모이드</text>
    <text x="360" y="58" font-size="13">Sigmoid</text>
    <text x="600" y="39" font-size="16" font-weight="700">ReLU</text>
    <text x="600" y="58" font-size="13">Rectified Linear Unit</text>
  </g>

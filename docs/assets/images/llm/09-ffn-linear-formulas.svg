<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" role="img" aria-labelledby="title desc">
<title id="title">활성화 함수 없는 다층 계산을 하나의 선형 변환으로 정리</title><desc id="desc">가중치를 전개하고 묶으면 전체 계산이 y = 4W₁ + 2W₂로 정리됩니다.</desc>
<style>text{fill:#393630;font-family:'Chalkboard SE','Segoe Print','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',cursive;font-size:25px}</style>
<text x="48" y="43">y</text><text x="82" y="43" text-anchor="middle">=</text><text x="108" y="43"><tspan fill="#3d789d">(4w₁ + 2w₃)w₅</tspan><tspan> + </tspan><tspan fill="#3d8b75">(4w₂ + 2w₄)w₆</tspan></text><text x="82" y="91" text-anchor="middle">=</text><text x="108" y="91">4w₁w₅ + 2w₃w₅ + 4w₂w₆ + 2w₄w₆</text><text x="82" y="139" text-anchor="middle">=</text><text x="108" y="139">4</text><text x="124" y="139" textLength="180" lengthAdjust="spacing">(w₁w₅ + w₂w₆)</text><text x="316" y="139">+ 2</text><text x="355.00" y="139" textLength="180" lengthAdjust="spacing">(w₃w₅ + w₄w₆)</text><text x="82" y="224" text-anchor="middle">=</text><text x="108" y="224">4W₁ + 2W₂</text><path d="M124 149 V157 Q214 159 304 157 V149" fill="none" stroke="#536268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="214" y="181" text-anchor="middle" style="font-size:20px">①</text><path d="M355.00 149 V157 Q445.00 159 535.00 157 V149" fill="none" stroke="#536268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="445.00" y="181" text-anchor="middle" style="font-size:20px">②</text></svg>
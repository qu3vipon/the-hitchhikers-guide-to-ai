<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
<title id="title">정답을 한 칸 오른쪽으로 이동한 디코더 입력</title><desc id="desc">위쪽 정답 I, drink, coffee, EOS에서 EOS를 제외하고 각 토큰을 아래쪽 한 칸 오른쪽으로 이동합니다. 맨 앞에는 BOS를 추가하여 디코더 입력을 만듭니다.</desc>

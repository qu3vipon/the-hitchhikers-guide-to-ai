  <text x="610" y="184">y</text>
  <g fill="none" stroke="#f5d5cf" stroke-width="17.20" stroke-linecap="butt" stroke-linejoin="round"><path d="M318.60 72.46 Q374.00 71.16 429.40 71.96" /><path d="M319.60 84.50 Q374.50 83.20 429.40 85.00" /><path d="M318.60 96.54 Q373.50 95.24 428.40 96.04" /></g><text x="374" y="91">w<tspan class="sub" dy="8">1</tspan><tspan dy="-8"> = ?</tspan></text>

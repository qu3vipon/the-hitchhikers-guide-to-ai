<path d="M138 232 C162 231 182 251 181 275 C182 299 162 319 138 318 C114 319 94 299 95 275 C94 251 114 231 138 232 Z" />
<path d="M610 132 C634 131 654 151 653 175 C654 199 634 219 610 218 C586 219 566 199 567 175 C566 151 586 131 610 132 Z" />

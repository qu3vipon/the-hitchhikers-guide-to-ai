<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="320" viewBox="-120 0 1160 320" role="img" aria-labelledby="title desc">
  <title id="title">가중치에 따른 지원자 A와 B의 점수 비교</title>
  <desc id="desc">지원자 A의 국어 영어 수학 점수는 90, 90, 70이고 B는 80, 80, 90이다. 원점수 총합은 둘 다 250이지만, 수학에 가중치 2를 적용하면 A는 320, B는 340으로 B가 높다.</desc>
  <style>
    text { fill: #393630; text-anchor: middle; dominant-baseline: central; }
    .word { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 22px; font-weight: 500; }
    .heading { font-size: 32px; font-weight: 600; }
    .math { font-family: 'Chalkboard SE', 'Segoe Print', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', cursive; font-size: 24px; font-weight: 500; }
    .caption { font-size: 18px; fill: #716c64; }
    .ink { fill: none; stroke: #393630; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .echo { fill: none; stroke: #393630; stroke-width: 1; opacity: .28; stroke-linecap: round; }
  </style>
  <defs>
    <g id="person">
      <path d="M0 -24 C10 -25 17 -17 16 -8 C17 1 9 9 0 8 C-10 9 -17 1 -16 -8 C-17 -17 -9 -25 0 -24 Z" fill="#e7eef0" stroke="#393630" stroke-width="2.5"/>
      <path class="ink" d="M-27 40 Q-27 16 -8 14 L8 14 Q28 16 27 40 Z" style="fill: #e7eef0;"/>
      <path class="echo" d="M-25 41 Q-28 19 -7 17 L9 16 Q25 18 29 39"/>
    </g>
  </defs>
  <text class="word" x="-60" y="183">원점수</text>
  <text class="word" x="-60" y="276">가중합</text>
  <use href="#person" transform="translate(183 60) scale(1.3)"/>
  <use href="#person" transform="translate(703 60) scale(1.3)"/>
  <text class="word heading" x="287" y="62">지원자 A</text>
  <text class="word heading" x="807" y="62">지원자 B</text>

  <text class="math" x="260" y="183">국어 90 + 영어 90 + 수학 70 = 250</text>
  <text class="math" x="780" y="183">국어 80 + 영어 80 + 수학 90 = 250</text>
  <path class="ink" d="M509 177 Q520 176 531 177 M509 189 Q520 188 531 189"/>

  <path d="M413 260 Q440 257 468 260 L466 290 Q441 293 414 290 Z" fill="#f5d5cf"/>
  <path d="M933 260 Q960 257 988 260 L986 290 Q961 293 934 290 Z" fill="#f5d5cf"/>
  <text class="math" x="260" y="276">(90 × 1) + (90 × 1) + (70 <tspan fill="#a65043" font-weight="700" dominant-baseline="auto" alignment-baseline="baseline" baseline-shift="0">× 2</tspan>) = 320</text>
  <text class="math" x="780" y="276">(80 × 1) + (80 × 1) + (90 <tspan fill="#a65043" font-weight="700" dominant-baseline="auto" alignment-baseline="baseline" baseline-shift="0">× 2</tspan>) = 340</text>
  <path class="ink" d="M531 264 Q519 270 509 276 Q520 282 531 288"/>
</svg>

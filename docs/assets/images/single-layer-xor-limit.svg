<svg xmlns="http://www.w3.org/2000/svg" width="660" height="200" viewBox="0 20 660 200" role="img" aria-labelledby="title desc">
  <title id="title">두 경고 신호의 네 가지 조합과 점검 결과</title>
  <desc id="desc">x1과 x2 중 하나만 1인 10과 01은 점검하고, 둘 다 0이거나 둘 다 1인 00과 11은 점검하지 않는다.</desc>
  <g fill="#ffffff" stroke-width="2">
    <rect x="20" y="32" width="300" height="172" rx="12" stroke="#c7834c"/>
    <rect x="340" y="32" width="300" height="172" rx="12" stroke="#c8d1d4"/>
  </g>
  <g fill="#536268" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="72" y="61">x₁</text><text x="144" y="61">x₂</text>
    <text x="392" y="61">x₁</text><text x="464" y="61">x₂</text>
  </g>
  <g stroke-width="2">
    <circle cx="72" cy="100" r="16" fill="#c7834c" stroke="#c7834c"/><circle cx="144" cy="100" r="16" fill="#ffffff" stroke="#8b989e"/>
    <circle cx="392" cy="100" r="16" fill="#ffffff" stroke="#8b989e"/><circle cx="464" cy="100" r="16" fill="#ffffff" stroke="#8b989e"/>
    <circle cx="72" cy="156" r="16" fill="#ffffff" stroke="#8b989e"/><circle cx="144" cy="156" r="16" fill="#c7834c" stroke="#c7834c"/>
    <circle cx="392" cy="156" r="16" fill="#c7834c" stroke="#c7834c"/><circle cx="464" cy="156" r="16" fill="#c7834c" stroke="#c7834c"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="72" y="106" fill="#ffffff">1</text><text x="144" y="106">0</text>
    <text x="392" y="106">0</text><text x="464" y="106">0</text>
    <text x="72" y="162">0</text><text x="144" y="162" fill="#ffffff">1</text>
    <text x="392" y="162" fill="#ffffff">1</text><text x="464" y="162" fill="#ffffff">1</text>
  </g>
  <g fill="#8b989e" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">
    <text x="208" y="124">→</text><text x="528" y="124">→</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="266" y="124" fill="#c7834c">점검</text>
    <text x="586" y="124" fill="#536268">점검 안 함</text>
  </g>
  <g fill="none" stroke="#c7834c" stroke-linecap="round" stroke-linejoin="round" transform="translate(-9 6) translate(393 136) scale(0.70 0.78) translate(-393 -136)">
    <path d="M393 136 C374 126 354 128 337 130 C329 126 322 132 323 141 C324 150 334 149 339 141 C344 130 325 125 309 132 C288 141 267 161 244 181" stroke-width="2.25" stroke-dasharray="3 5"/>
    <path d="M254 163 L244 181 L271 174" stroke-width="2.25" stroke-dasharray="3 5"/>
  </g>
  <text x="348" y="174" fill="#c7834c" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">잘못 판단</text>
</svg>

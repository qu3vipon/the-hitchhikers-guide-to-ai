<svg xmlns="http://www.w3.org/2000/svg" width="660" height="180" viewBox="0 0 660 180" role="img" aria-labelledby="title desc">
  <title id="title">편향이 가중 합 점수를 왼쪽으로 이동시키는 효과</title>
  <desc id="desc">편향을 더하기 전 가중 합 1점과 3점이 점선 화살표를 따라 각각 최종 평가 점수 -1점과 1점으로 왼쪽 이동한다. 0점 판단 기준의 왼쪽은 스팸 아님, 오른쪽은 스팸이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round">
    <line x1="95" y1="42" x2="565" y2="42" stroke="#5a6670" stroke-width="2.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="95" y1="118" x2="565" y2="118" stroke="#5a6670" stroke-width="2.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="330" y1="35" x2="330" y2="158" stroke="#c7834c" stroke-width="2.5" stroke-dasharray="5 5"/>
    <line x1="270" y1="112" x2="270" y2="124" stroke="#5a6670" stroke-width="2"/>
    <line x1="330" y1="112" x2="330" y2="124" stroke="#5a6670" stroke-width="2"/>
    <line x1="390" y1="112" x2="390" y2="124" stroke="#5a6670" stroke-width="2"/>
    <line x1="390" y1="54" x2="270" y2="101" stroke="#c7834c" stroke-width="2.25" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <line x1="510" y1="54" x2="390" y2="101" stroke="#c7834c" stroke-width="2.25" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#26353a" stroke-width="2.5">
    <circle cx="390" cy="42" r="9" fill="#ffffff"/>
    <circle cx="510" cy="42" r="9" fill="#ffffff"/>
    <circle cx="270" cy="118" r="11" fill="#2c7a64"/>
    <circle cx="390" cy="118" r="11" fill="#c35243"/>
  </g>
  <g fill="#26353a" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="390" y="25" font-size="15" font-weight="700">1점</text>
    <text x="510" y="25" font-size="15" font-weight="700">3점</text>
    <text x="270" y="95" font-size="16" font-weight="700">−1점</text>
    <text x="390" y="95" font-size="16" font-weight="700">1점</text>
    <text x="270" y="153" fill="#2c7a64" font-size="14" font-weight="700">스팸 아님</text>
    <text x="390" y="153" fill="#c35243" font-size="14" font-weight="700">스팸</text>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="330" y="22" fill="#c7834c" font-size="15" font-weight="700">판단 기준</text>
    <text x="330" y="175" fill="#c7834c" font-size="14">0점</text>
  </g>
  <g fill="#536268" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    <text x="120" y="31">편향 적용 전</text>
    <text x="120" y="107">편향 적용 후</text>
  </g>
</svg>

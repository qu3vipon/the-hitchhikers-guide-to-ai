<svg xmlns="http://www.w3.org/2000/svg" width="720" height="176" viewBox="0 42 720 176" role="img" aria-labelledby="title desc">
  <title id="title">텍스트에서 토큰 예측까지의 언어 처리 흐름</title>
  <desc id="desc">텍스트가 토큰화, 임베딩, 모델, 로짓, 소프트맥스, 확률 분포를 거쳐 다음 토큰 예측으로 이어지는 과정이다.</desc>

    <text x="224" y="72">임베딩</text>
    <text x="333" y="72">모델</text>
    <text x="441" y="72">로짓</text>
    <text x="521" y="72">softmax</text>
    <text x="601" y="72">확률 분포</text>
    <text x="681" y="72">토큰 예측</text>
  </g>

